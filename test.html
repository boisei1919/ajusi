<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파오후 아저씨의 전당</title>
    <style>
        /* 여기서부터 디자인(CSS)입니다 */
        body {
            font-family: 'Gowun Dodum', sans-serif; /* 둥글둥글한 폰트 */
            background-color: #fdf6e3; /* 따뜻한 크림색 배경 */
            color: #586e75;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d33682;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .profile-img {
            width: 200px;
            height: 200px;
            background-color: #eee;
            border-radius: 50%; /* 동그라미 프사 */
            margin: 20px auto;
            object-fit: cover;
            border: 5px solid #d33682;
        }
        .desc {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .stats {
            background-color: #eee8d5;
            padding: 15px;
            border-radius: 10px;
            list-style: none;
            padding-left: 0;
        }
        .stats li {
            padding: 5px;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #d33682;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍕 파오후 아저씨 🥤</h1>
        
        <img src="https://placebear.com/400/400" alt="파오후 아저씨 사진" class="profile-img">
        
        <div class="desc">
            <p><strong>"후욱... 후욱... 이건 살이 아니라 인격이야."</strong></p>
            <p>
                이곳은 풍만한 매력의 소유자,<br>
                파오후 아저씨를 기리는 공간입니다.<br>
                콜라와 피자를 사랑하는 그의 일상을 확인하세요.
            </p>
        </div>

        <ul class="stats">
            <li>💖 좋아하는 것: 배달 음식, 누워있기</li>
            <li>🚫 싫어하는 것: 계단, 브로콜리</li>
            <li>⚖️ 체중: 비밀 (3자리 추정)</li>
        </ul>

        <a href="#" class="btn">아저씨에게 간식 주기</a>
    </div>

</body>
</html>
